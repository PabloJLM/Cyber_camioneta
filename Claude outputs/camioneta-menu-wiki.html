const canvas = document.getElementById('oled');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

const CYAN = '#3fe8ff';
const BLACK = '#000000';

function drawBits(bits, x0, y0) {
  ctx.fillStyle = CYAN;
  for (let row = 0; row < bits.length; row++) {
    for (let col = 0; col < bits[row].length; col++) {
      if (bits[row][col]) ctx.fillRect(x0 + col, y0 + row, 1, 1);
    }
  }
}

// text rendered with an actual pixel-art font (Silkscreen), supersampled
// and box-averaged back down to native resolution so it stays crisp (no
// gray anti-aliased edges) once the CSS scales the canvas up.
const SS = 8;
const textLayer = document.createElement('canvas');
textLayer.width = 128 * SS; textLayer.height = 64 * SS;
const tctx = textLayer.getContext('2d');
tctx.textBaseline = 'alphabetic';
function pixelText(str, x, yBaseline, invert, sizePx) {
  tctx.clearRect(0, 0, textLayer.width, textLayer.height);
  tctx.font = `700 ${sizePx * SS}px "Silkscreen", monospace`;
  tctx.fillStyle = '#fff';
  tctx.fillText(str, x * SS, yBaseline * SS);
  const data = tctx.getImageData(0, 0, textLayer.width, textLayer.height).data;
  ctx.fillStyle = invert ? BLACK : CYAN;
  for (let py = 0; py < 64; py++) {
    for (let px = 0; px < 128; px++) {
      let sum = 0;
      for (let sy = 0; sy < SS; sy++) {
        for (let sx = 0; sx < SS; sx++) {
          const sxi = px * SS + sx, syi = py * SS + sy;
          sum += data[(syi * textLayer.width + sxi) * 4 + 3];
        }
      }
      const avg = sum / (SS * SS);
      if (avg > 70) ctx.fillRect(px, py, 1, 1);
    }
  }
}

const Y_POS = [24,36,48,60];
const menuSelection = 0; // arrow fixed at the first row (where APPS used to be)

function draw() {
  // clearBuffer()
  ctx.fillStyle = BLACK;
  ctx.fillRect(0,0,128,64);

  // header box, drawColor(1) fill, same coords as C++: drawBox(16,1,96,14)
  ctx.fillStyle = CYAN;
  ctx.fillRect(16,1,96,14);

  // "CIBERSEGURIDAD" drawn with drawColor(2) (XOR) on top of the solid box —
  // visually = dark text cut into the cyan bar
  pixelText("CIBERSEGURIDAD", 22, 12, true, 7);

  // side icons, drawXBM(0,1,16,14,...) and (112,1,16,14,...)
  drawBits(ICON_BITS, 0, 1);
  drawBits(ICON_BITS, 112, 1);

  // selection arrow + "WIKI" label aligned next to it (menu items removed, no animation)
  drawBits(ARROW_BITS, 30, Y_POS[menuSelection]-7);
  pixelText("WIKI", 37, Y_POS[menuSelection], false, 7);

  // static camioneta, drawXBM(85,36,32,32,...) — fixed on frame 1, no animation loop
  drawBits(BUS1_BITS, 85, 36);
}

// wait for the pixel font to actually load before drawing, otherwise the
// first paint falls back to a system font
document.fonts.load('700 56px "Silkscreen"').then(draw).catch(draw);
document.fonts.ready.then(draw);
draw();
