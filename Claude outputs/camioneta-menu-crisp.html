const canvas = document.getElementById('oled');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

const CYAN = '#3fe8ff';
const BLACK = '#000000';

function drawBits(bits, x0, y0) {
  ctx.fillStyle = CYAN;
  for (let row = 0; row < bits.length; row++) {
    for (let col = 0; col < bits[row].length; col++) {
      if (bits[row][col]) ctx.fillRect(x0 + col, y0 + row, 1, 1);
    }
  }
}

// Hand-authored 5x7 pixel font — each glyph drawn the exact same way as
// the icon/arrow/bus bitmaps (one solid pixel per cell). No canvas text
// rendering, no font loading, no antialiasing: this cannot blur.
const FONT = {
  A: ["01110","10001","10001","11111","10001","10001","10001"],
  B: ["11110","10001","10001","11110","10001","10001","11110"],
  C: ["01111","10000","10000","10000","10000","10000","01111"],
  D: ["11110","10001","10001","10001","10001","10001","11110"],
  E: ["11111","10000","10000","11110","10000","10000","11111"],
  G: ["01111","10000","10000","10011","10001","10001","01111"],
  I: ["11111","00100","00100","00100","00100","00100","11111"],
  K: ["10001","10010","10100","11000","10100","10010","10001"],
  R: ["11110","10001","10001","11110","10100","10010","10001"],
  S: ["01111","10000","10000","01110","00001","00001","11110"],
  U: ["10001","10001","10001","10001","10001","10001","01110"],
  W: ["10001","10001","10001","10001","10101","10101","01010"],
};
function pixelText(str, x, yTop, invert) {
  ctx.fillStyle = invert ? BLACK : CYAN;
  let cx = x;
  for (const ch of str.toUpperCase()) {
    const glyph = FONT[ch];
    if (glyph) {
      for (let row = 0; row < glyph.length; row++) {
        for (let col = 0; col < glyph[row].length; col++) {
          if (glyph[row][col] === '1') ctx.fillRect(cx + col, yTop + row, 1, 1);
        }
      }
    }
    cx += 6; // 5px glyph + 1px spacing
  }
}

const Y_POS = [24,36,48,60];
const menuSelection = 0; // arrow fixed at the first row (where APPS used to be)

function draw() {
  // clearBuffer()
  ctx.fillStyle = BLACK;
  ctx.fillRect(0,0,128,64);

  // header box, drawColor(1) fill, same coords as C++: drawBox(16,1,96,14)
  ctx.fillStyle = CYAN;
  ctx.fillRect(16,1,96,14);

  // "CIBERSEGURIDAD" drawn with drawColor(2) (XOR) on top of the solid box —
  // visually = dark text cut into the cyan bar
  pixelText("CIBERSEGURIDAD", 21, 4, true);

  // side icons, drawXBM(0,1,16,14,...) and (112,1,16,14,...)
  drawBits(ICON_BITS, 0, 1);
  drawBits(ICON_BITS, 112, 1);

  // selection arrow + "WIKI" label aligned next to it (menu items removed, no animation)
  drawBits(ARROW_BITS, 30, Y_POS[menuSelection]-7);
  pixelText("WIKI", 37, Y_POS[menuSelection]-6, false);

  // static camioneta, drawXBM(85,36,32,32,...) — fixed on frame 1, no animation loop
  drawBits(BUS1_BITS, 85, 36);
}
